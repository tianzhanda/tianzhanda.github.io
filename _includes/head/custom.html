<!--
  =============================================
  Tian's Blog - Dark Geek Theme
  =============================================
-->

<!-- Font Preload & Load -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ==========================================
   CSS Custom Properties
   ========================================== */
:root {
  --bg-primary: #0a0e14;
  --bg-card: rgba(13, 17, 23, 0.85);
  --text-primary: #e6edf3;
  --text-secondary: #8b949e;
  --accent-green: #00ff9d;
  --accent-blue: #58a6ff;
  --accent-orange: #f0883e;
  --accent-purple: #a855f7;
  --border-dim: rgba(48, 54, 61, 0.5);
  --glow-green: rgba(0, 255, 157, 0.15);
  --glow-blue: rgba(88, 166, 255, 0.15);
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --font-mono: 'JetBrains Mono', 'SF Mono', 'Monaco', 'Cascadia Code', 'Menlo', monospace;
  --font-sans: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
}

/* ==========================================
   Base Styles
   ========================================== */
body {
  font-family: var(--font-mono);
  background: var(--bg-primary) !important;
  color: var(--text-primary) !important;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-mono);
  color: var(--text-primary);
}

p, li, span, div {
  font-family: var(--font-mono);
}

/* Chinese text optimization */
:lang(zh), .zh-text, h1:lang(zh), h2:lang(zh), h3:lang(zh),
.category-tag, .post-tag, .section-label {
  font-family: var(--font-sans), var(--font-mono);
}

/* Subtle scanlines overlay */
body::after {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0, 255, 157, 0.03) 2px,
    rgba(0, 255, 157, 0.03) 4px
  );
  pointer-events: none;
  z-index: 99999;
}

/* Selection */
::selection {
  background: rgba(0, 255, 157, 0.2);
  color: var(--text-primary);
}

/* Custom scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }
::-webkit-scrollbar-thumb {
  background: rgba(0, 255, 157, 0.2);
  border-radius: var(--radius-sm);
}
::-webkit-scrollbar-thumb:hover {
  background: rgba(0, 255, 157, 0.4);
}

/* Links */
a {
  color: var(--accent-blue);
  transition: color 0.25s ease, text-shadow 0.25s ease;
  text-decoration: none;
}
a:hover {
  color: var(--accent-green);
  text-shadow: 0 0 8px rgba(0, 255, 157, 0.3);
}

/* ==========================================
   Masthead / Navigation
   ========================================== */
.masthead {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(10, 14, 20, 0.85) !important;
  backdrop-filter: blur(20px) saturate(200%) !important;
  -webkit-backdrop-filter: blur(20px) saturate(200%) !important;
  border-bottom: 1px solid rgba(0, 255, 157, 0.06) !important;
  box-shadow: 0 1px 0 rgba(255, 255, 255, 0.015);
}

.masthead__inner-wrap {
  max-width: 1280px !important;
  padding: 0 24px !important;
}

/* ── Site title ── */
.site-title {
  font-family: var(--font-mono) !important;
  font-weight: 700 !important;
  font-size: 1rem !important;
  color: var(--accent-green) !important;
  display: inline-flex !important;
  align-items: center !important;
  gap: 8px !important;
  padding: 8px 16px !important;
  margin: 6px 0 !important;
  border: 1px solid rgba(0, 255, 157, 0.12);
  border-radius: 6px;
  background: rgba(0, 255, 157, 0.025);
  transition: all 0.3s ease;
  letter-spacing: 0.5px;
  text-decoration: none !important;
}

.site-title::before {
  content: '~';
  font-size: 0.9rem;
  color: rgba(0, 255, 157, 0.35);
  font-weight: 400;
}

.site-title:hover {
  background: rgba(0, 255, 157, 0.05);
  border-color: rgba(0, 255, 157, 0.25);
  box-shadow: 0 0 20px rgba(0, 255, 157, 0.06);
}

/* ── Nav items ── */
.greedy-nav {
  display: flex !important;
  align-items: center !important;
  gap: 6px !important;
}

.masthead__menu-item {
  margin: 0 !important;
}

.masthead__menu-item a,
.greedy-nav a {
  font-family: var(--font-mono) !important;
  font-size: 0.8rem !important;
  font-weight: 500 !important;
  color: var(--text-secondary) !important;
  padding: 8px 18px !important;
  border-radius: 20px !important;
  transition: all 0.25s ease !important;
  letter-spacing: 0.3px !important;
  text-decoration: none !important;
  border: 1px solid transparent !important;
  line-height: 1 !important;
}

.masthead__menu-item a:hover,
.greedy-nav a:hover {
  color: var(--accent-green) !important;
  background: rgba(0, 255, 157, 0.05) !important;
  border-color: rgba(0, 255, 157, 0.1) !important;
}

/* ── Active page mark ── */
.masthead__menu-item--active a {
  color: var(--accent-green) !important;
  background: rgba(0, 255, 157, 0.07) !important;
  border-color: rgba(0, 255, 157, 0.15) !important;
}

/* ── Hidden menu dropdown (mobile) ── */
.greedy-nav .hidden-links {
  background: rgba(10, 14, 20, 0.97) !important;
  backdrop-filter: blur(20px) !important;
  -webkit-backdrop-filter: blur(20px) !important;
  border: 1px solid rgba(0, 255, 157, 0.08) !important;
  border-radius: 10px !important;
  padding: 6px !important;
  margin-top: 8px !important;
}

.greedy-nav .hidden-links a {
  display: block !important;
  border-radius: 8px !important;
  padding: 10px 18px !important;
  margin: 2px 0 !important;
}

/* ── Hamburger toggle button ── */
.greedy-nav button {
  background: rgba(0, 255, 157, 0.04) !important;
  border: 1px solid rgba(0, 255, 157, 0.1) !important;
  border-radius: 6px !important;
  padding: 6px 10px !important;
  color: var(--text-secondary) !important;
  cursor: pointer !important;
  transition: all 0.25s ease !important;
}

.greedy-nav button:hover {
  background: rgba(0, 255, 157, 0.08) !important;
  border-color: rgba(0, 255, 157, 0.2) !important;
  color: var(--accent-green) !important;
}

.greedy-nav button svg {
  stroke: var(--text-secondary);
  transition: stroke 0.25s ease;
}

.greedy-nav button:hover svg {
  stroke: var(--accent-green);
}

/* ==========================================
   Page / Content Width
   ========================================== */
@media (min-width: 80em) {
  .page {
    width: calc(100%);
    padding-inline-end: 300px;
  }
  .archive {
    width: calc(100%);
    padding-inline-end: 300px;
  }
  .page, .page__related, .page__content {
    float: left !important;
    clear: left !important;
  }
}

/* Full-width for home page */
.layout--default .page {
  width: 100% !important;
  padding-inline-end: 0 !important;
}

/* ==========================================
   Hero Section
   ========================================== */
.hero-section {
  text-align: center;
  padding: 120px 20px 80px;
  position: relative;
  overflow: hidden;
}

/* Grid background */
.hero-section::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background-image:
    linear-gradient(rgba(0, 255, 157, 0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 255, 157, 0.04) 1px, transparent 1px);
  background-size: 60px 60px;
  pointer-events: none;
}

.hero-content {
  position: relative;
  z-index: 1;
}

.hero-title {
  font-size: 4rem;
  font-weight: 700;
  color: var(--accent-green);
  text-shadow: 0 0 30px rgba(0, 255, 157, 0.3),
               0 0 60px rgba(0, 255, 157, 0.1);
  margin: 0 0 24px;
  letter-spacing: -1px;
  animation: heroFadeIn 0.8s ease-out;
}

@keyframes heroFadeIn {
  from {
    opacity: 0;
    transform: translateY(-10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.hero-subtitle {
  font-size: 1.15rem;
  color: var(--text-secondary);
  margin: 0 0 48px;
  min-height: 1.6em;
  font-weight: 400;
}

/* Typing cursor */
.typing-cursor::after {
  content: '|';
  animation: blink 1s step-end infinite;
  color: var(--accent-green);
  font-weight: 400;
}

@keyframes blink {
  0%, 50% { opacity: 1; }
  51%, 100% { opacity: 0; }
}

/* Hero stats */
.hero-stats {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 24px;
  font-size: 0.9rem;
  animation: heroFadeIn 0.8s ease-out 0.2s both;
}

.stat-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}

.stat-number {
  font-size: 1.8rem;
  font-weight: 700;
  color: var(--accent-green);
  text-shadow: 0 0 12px rgba(0, 255, 157, 0.3);
}

.stat-label {
  font-size: 0.8rem;
  color: var(--text-secondary);
  letter-spacing: 1px;
}

.stat-divider {
  color: var(--border-dim);
  font-size: 1.5rem;
}

/* Scroll indicator */
.scroll-indicator {
  position: absolute;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 1;
  animation: bounce 2s ease-in-out infinite;
  opacity: 0.6;
}

@keyframes bounce {
  0%, 20%, 50%, 80%, 100% { transform: translateX(-50%) translateY(0); opacity: 0.6; }
  40% { transform: translateX(-50%) translateY(-10px); opacity: 1; }
  60% { transform: translateX(-50%) translateY(-5px); opacity: 0.8; }
}

.scroll-indicator svg {
  display: block;
  stroke: var(--accent-green);
}

/* ==========================================
   Category Cloud
   ========================================== */
.category-cloud-section {
  border-top: 1px solid var(--border-dim);
  border-bottom: 1px solid var(--border-dim);
}

.section-label {
  text-align: center;
  font-size: 0.75rem;
  color: var(--text-secondary);
  letter-spacing: 2px;
  padding: 24px 0 0;
  text-transform: uppercase;
}

.category-cloud {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  padding: 20px 20px 28px;
}

.category-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 18px;
  border: 1px solid rgba(88, 166, 255, 0.25);
  border-radius: 20px;
  color: var(--accent-blue);
  font-size: 0.82rem;
  font-family: var(--font-sans);
  transition: border-color 0.25s ease,
              color 0.25s ease,
              background 0.25s ease,
              transform 0.25s ease,
              box-shadow 0.25s ease;
  background: rgba(88, 166, 255, 0.04);
  cursor: pointer;
}

.category-tag:hover {
  border-color: var(--accent-green);
  color: var(--accent-green);
  background: rgba(0, 255, 157, 0.08);
  box-shadow: 0 0 16px rgba(0, 255, 157, 0.15);
  transform: translateY(-2px);
  text-shadow: none;
}

.category-count {
  font-size: 0.7rem;
  opacity: 0.6;
  font-family: var(--font-mono);
}

/* ==========================================
   Posts Grid
   ========================================== */
.posts-section {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 20px;
}

.posts-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 20px;
  padding: 24px 0 48px;
}

/* Post card */
.post-card {
  position: relative;
  background: var(--bg-card);
  border: 1px solid var(--border-dim);
  border-radius: var(--radius-md);
  padding: 28px 24px;
  transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1),
              border-color 0.35s ease,
              box-shadow 0.35s ease;
  overflow: hidden;
}

/* Left gradient border accent */
.post-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 3px; height: 100%;
  background: linear-gradient(180deg, var(--accent-green), var(--accent-blue));
  opacity: 0;
  transition: opacity 0.35s ease;
  border-radius: 3px 0 0 3px;
}

.post-card:hover {
  border-color: rgba(0, 255, 157, 0.25);
  transform: translateY(-4px);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4),
              0 0 24px rgba(0, 255, 157, 0.08);
}

.post-card:hover::before {
  opacity: 1;
}

/* New badge */
.new-badge {
  position: absolute;
  top: 0; right: 0;
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 1px;
  padding: 3px 10px;
  background: rgba(0, 255, 157, 0.12);
  color: var(--accent-green);
  border-left: 1px solid rgba(0, 255, 157, 0.2);
  border-bottom: 1px solid rgba(0, 255, 157, 0.2);
  border-radius: 0 var(--radius-md) 0 var(--radius-sm);
  font-family: var(--font-mono);
}

/* Post title */
.post-card-title {
  font-size: 1.1rem;
  font-weight: 600;
  line-height: 1.45;
  margin: 0 0 14px;
  padding-right: 40px; /* space for new badge */
}

.post-card-title a {
  color: var(--text-primary);
  transition: color 0.25s ease;
}

.post-card-title a:hover {
  color: var(--accent-green);
  text-shadow: none;
}

/* Post meta */
.post-card-meta {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
  font-size: 0.8rem;
  color: var(--text-secondary);
  margin-bottom: 14px;
  font-family: var(--font-mono);
}

.post-card-meta span {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.post-card-meta svg {
  flex-shrink: 0;
  stroke: var(--text-secondary);
}

/* Post excerpt */
.post-card-excerpt {
  font-size: 0.88rem;
  color: var(--text-secondary);
  line-height: 1.65;
  margin: 0 0 16px;
}

/* Post tags */
.post-card-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.post-tag {
  font-size: 0.72rem;
  padding: 3px 10px;
  background: rgba(240, 136, 62, 0.08);
  color: var(--accent-orange);
  border: 1px solid rgba(240, 136, 62, 0.15);
  border-radius: var(--radius-sm);
  font-family: var(--font-mono);
}

/* Fade-in animation */
.fade-in-up {
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 0.6s ease, transform 0.6s ease;
}

.fade-in-up.visible {
  opacity: 1;
  transform: translateY(0);
}

/* ==========================================
   Site Stats
   ========================================== */
.site-stats {
  text-align: center;
  padding: 40px 20px;
  border-top: 1px solid var(--border-dim);
  color: var(--text-secondary);
  font-size: 0.85rem;
  font-family: var(--font-mono);
}

/* ==========================================
   Code & Pre
   ========================================== */
.highlight {
  border-radius: var(--radius-md) !important;
}

pre {
  border-radius: var(--radius-md) !important;
  font-family: var(--font-mono) !important;
}

/* Hide Copy to clipboard text */
.code-copy-button .sr-only {
  display: none !important;
}
.code-copy-button {
  min-width: auto !important;
  padding: 4px 8px !important;
}

/* ==========================================
   Breadcrumbs
   ========================================== */
.breadcrumbs {
  display: flex !important;
  justify-content: center;
  flex-wrap: wrap;
}

/* ==========================================
   Footer
   ========================================== */
.page__footer {
  background: var(--bg-primary) !important;
  border-top: 1px solid var(--border-dim) !important;
  color: var(--text-secondary) !important;
  font-family: var(--font-mono);
}

/* ==========================================
   Page views counter
   ========================================== */
.page-views-counter {
  text-align: center;
  margin-top: 32px;
  padding: 12px;
}

/* ==========================================
   Mobile Responsive
   ========================================== */
@media (max-width: 768px) {
  .hero-section {
    padding: 80px 16px 60px;
  }

  .hero-title {
    font-size: 2.2rem;
  }

  .hero-subtitle {
    font-size: 1rem;
  }

  .hero-stats {
    gap: 16px;
  }

  .stat-number {
    font-size: 1.4rem;
  }

  .posts-grid {
    grid-template-columns: 1fr;
    gap: 16px;
  }

  .post-card {
    padding: 22px 18px;
  }

  .category-cloud {
    gap: 8px;
    padding: 16px 12px 24px;
  }

  .category-tag {
    padding: 5px 14px;
    font-size: 0.78rem;
  }

  .site-stats {
    padding: 28px 16px;
    font-size: 0.8rem;
  }

  /* ── Mobile nav fixes ── */
  .masthead__inner-wrap {
    padding: 0 8px !important;
  }

  .site-title {
    font-size: 0.8rem !important;
    padding: 5px 10px !important;
    margin: 4px 0 !important;
    max-width: 100px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    display: inline-flex !important;
  }

  .site-title::before {
    font-size: 0.75rem !important;
  }

  .greedy-nav {
    gap: 4px !important;
  }

  .masthead__menu-item a,
  .greedy-nav a {
    font-size: 0.75rem !important;
    padding: 6px 12px !important;
  }

  .greedy-nav button {
    padding: 4px 8px !important;
  }

  /* Hide search button on mobile */
  .search-toggle-btn {
    display: none !important;
  }
}

/* ==========================================
   Search Overlay
   ========================================== */
.search-overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.search-overlay.active {
  display: flex;
  align-items: flex-start;
  justify-content: center;
}

.search-panel {
  position: relative;
  width: 100%;
  max-width: 680px;
  margin-top: 80px;
  background: #0d1117;
  border: 1px solid rgba(0, 255, 157, 0.15);
  border-radius: 12px;
  box-shadow: 0 8px 64px rgba(0, 0, 0, 0.6), 0 0 40px rgba(0, 255, 157, 0.06);
  overflow: hidden;
  animation: searchSlideIn 0.2s ease-out;
}

@keyframes searchSlideIn {
  from { opacity: 0; transform: translateY(-12px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.search-panel input {
  width: 100%;
  padding: 18px 20px;
  font-size: 1.05rem;
  font-family: 'JetBrains Mono', 'SF Mono', monospace;
  background: transparent;
  border: none;
  border-bottom: 1px solid rgba(0, 255, 157, 0.1);
  color: #e6edf3;
  outline: none;
}

.search-panel input::placeholder {
  color: #484f58;
}

.search-panel input:focus {
  border-bottom-color: rgba(0, 255, 157, 0.3);
}

.search-close-btn {
  position: absolute;
  top: 12px;
  right: 14px;
  background: none;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 6px;
  color: #8b949e;
  cursor: pointer;
  padding: 4px 10px;
  font-size: 0.8rem;
  font-family: 'JetBrains Mono', monospace;
  transition: all 0.2s ease;
}

.search-close-btn:hover {
  color: #e6edf3;
  border-color: rgba(255,255,255,0.2);
  background: rgba(255,255,255,0.04);
}

.search-results {
  max-height: 480px;
  overflow-y: auto;
  padding: 8px;
}

.search-results::-webkit-scrollbar { width: 4px; }
.search-results::-webkit-scrollbar-thumb {
  background: rgba(0, 255, 157, 0.2);
  border-radius: 2px;
}

.search-result-item {
  display: block;
  padding: 12px 14px;
  border-radius: 8px;
  text-decoration: none;
  transition: background 0.15s ease;
  border-bottom: 1px solid rgba(255,255,255,0.03);
}

.search-result-item:last-child {
  border-bottom: none;
}

.search-result-item:hover {
  background: rgba(0, 255, 157, 0.04);
}

.search-result-title {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.95rem;
  font-weight: 600;
  color: #e6edf3;
  margin-bottom: 4px;
}

.search-result-item:hover .search-result-title {
  color: #00ff9d;
}

.search-result-meta {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.75rem;
  color: #8b949e;
  display: flex;
  gap: 12px;
  align-items: center;
}

.search-result-excerpt {
  font-size: 0.82rem;
  color: #8b949e;
  margin-top: 6px;
  line-height: 1.5;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.search-result-tag {
  font-size: 0.7rem;
  padding: 1px 6px;
  border-radius: 3px;
  background: rgba(240, 136, 62, 0.1);
  color: #f0883e;
}

.search-results-empty {
  padding: 32px;
  text-align: center;
  color: #484f58;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.85rem;
}

.search-results-loading {
  padding: 32px;
  text-align: center;
  color: #484f58;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.85rem;
}

@media (max-width: 768px) {
  .search-panel {
    margin-top: 40px;
    max-width: 94%;
  }
  .search-panel input {
    padding: 14px 16px;
    font-size: 0.95rem;
  }
  .search-results {
    max-height: 60vh;
  }
}
</style>

<!-- Page views counter -->
<script>
document.addEventListener("DOMContentLoaded", function() {
  // ── Search button ──
  var nav = document.querySelector('.greedy-nav');
  if (nav) {
    var searchBtn = document.createElement('button');
    searchBtn.className = 'search-toggle-btn';
    searchBtn.setAttribute('aria-label', '搜索');
    searchBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>';
    searchBtn.style.cssText = 'background:none;border:1px solid rgba(255,255,255,0.06);border-radius:6px;color:#8b949e;cursor:pointer;padding:6px 10px;display:flex;align-items:center;transition:all 0.2s ease;margin-left:6px;';
    searchBtn.onmouseenter = function() { this.style.color = '#00ff9d'; this.style.borderColor = 'rgba(0,255,157,0.2)'; };
    searchBtn.onmouseleave = function() { this.style.color = '#8b949e'; this.style.borderColor = 'rgba(255,255,255,0.06)'; };
    nav.appendChild(searchBtn);

    // ── Search overlay HTML ──
    var overlay = document.createElement('div');
    overlay.className = 'search-overlay';
    overlay.innerHTML = '<div class="search-panel"><input type="text" id="search-input" placeholder="搜索文章... (Cmd+K)" autocomplete="off" spellcheck="false"/><button class="search-close-btn">ESC</button><div class="search-results"><div class="search-results-loading">加载搜索索引中...</div></div></div>';
    document.body.appendChild(overlay);

    var input = overlay.querySelector('#search-input');
    var results = overlay.querySelector('.search-results');
    var closeBtn = overlay.querySelector('.search-close-btn');

    // Open
    searchBtn.addEventListener('click', function() {
      overlay.classList.add('active');
      setTimeout(function() { input.focus(); }, 100);
      // Load search data on first open
      if (!window._searchReady) initSearch();
    });

    // Also open search on tapping/cliking the site title (handy on mobile)
    var siteTitle = document.querySelector('.site-title');
    if (siteTitle && window.innerWidth <= 768) {
      siteTitle.addEventListener('click', function(e) {
        overlay.classList.add('active');
        setTimeout(function() { input.focus(); }, 100);
        if (!window._searchReady) initSearch();
      });
    }

    // Close
    function closeSearch() {
      overlay.classList.remove('active');
      input.value = '';
      results.innerHTML = '';
    }
    closeBtn.addEventListener('click', closeSearch);
    overlay.addEventListener('click', function(e) {
      if (e.target === overlay) closeSearch();
    });
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && overlay.classList.contains('active')) closeSearch();
      if (((e.metaKey || e.ctrlKey) && e.key === 'k') && !overlay.classList.contains('active')) {
        e.preventDefault();
        searchBtn.click();
      }
      // / key to open search (but not in input fields)
      if (e.key === '/' && !overlay.classList.contains('active') &&
          !['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) {
        e.preventDefault();
        searchBtn.click();
      }
    });

    // ── MiniSearch init ──
    function initSearch() {
      if (window._searchReady) return;
      var script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/minisearch@7.2.0/dist/umd/index.min.js';
      script.onload = function() {
        fetch('/search.json')
          .then(function(r) { return r.json(); })
          .then(function(data) {
            window._searchIdx = new MiniSearch({
              fields: ['title', 'content', 'tags', 'categories'],
              storeFields: ['title', 'url', 'date', 'tags', 'categories'],
              searchOptions: {
                boost: { title: 4, tags: 2, categories: 1.5, content: 1 },
                prefix: true,
                fuzzy: 0.2,
              },
              tokenize: function(text) {
                return text.split(/[\s,.;:!?()\[\]{}"'，。；：！？（）【】""'']+|(?=[\u4e00-\u9fff])/).filter(Boolean);
              }
            });
            window._searchIdx.addAll(data);
            window._searchReady = true;
            results.innerHTML = '<div class="search-results-empty">输入关键词开始搜索</div>';
          })
          .catch(function() {
            results.innerHTML = '<div class="search-results-empty">搜索索引加载失败</div>';
          });
      };
      script.onerror = function() {
        results.innerHTML = '<div class="search-results-empty">搜索库加载失败，请刷新页面重试</div>';
      };
      document.head.appendChild(script);
    }

    // ── Search input handler ──
    input.addEventListener('input', function() {
      var query = this.value.trim();
      if (!window._searchReady) {
        results.innerHTML = '<div class="search-results-loading">索引加载中...</div>';
        return;
      }
      if (!query) {
        results.innerHTML = '<div class="search-results-empty">输入关键词开始搜索</div>';
        return;
      }

      var hits = window._searchIdx.search(query, { prefix: true, fuzzy: 0.2 });
      if (hits.length === 0) {
        results.innerHTML = '<div class="search-results-empty">未找到相关文章</div>';
        return;
      }

      var html = '';
      for (var i = 0; i < Math.min(hits.length, 20); i++) {
        var item = hits[i];
        var excerpt = item.content ? (item.content.length > 120 ? item.content.substring(0, 120) + '...' : item.content) : '';
        var tagsHtml = '';
        if (item.tags && item.tags.length) {
          tagsHtml = item.tags.slice(0, 3).map(function(t) { return '<span class="search-result-tag">#' + t + '</span>'; }).join('');
        }
        html += '<a class="search-result-item" href="' + item.url + '">' +
          '<div class="search-result-title">' + item.title + '</div>' +
          '<div class="search-result-meta">' +
            '<span>' + item.date + '</span>' +
            tagsHtml +
          '</div>' +
          (excerpt ? '<div class="search-result-excerpt">' + excerpt + '</div>' : '') +
        '</a>';
      }
      if (hits.length > 20) {
        html += '<div class="search-results-empty">还有 ' + (hits.length - 20) + ' 条结果，请更精确搜索</div>';
      }
      results.innerHTML = html;
    });
  }

  // ── Page views counter ──
  var counter = document.createElement('div');
  counter.className = 'page-views-counter';
  counter.innerHTML = '<a href="https://hitscounter.dev" target="_blank"><img src="https://hitscounter.dev/api/hit?url=https%3A%2F%2Ftianzhanda.github.io&label=Visitors&icon=eye-fill&color=%231d9bf0" alt="hits counter" /></a>';

  var main = document.querySelector('.page__content') || document.querySelector('main');
  if (main) {
    main.appendChild(counter);
  }
});
</script>
