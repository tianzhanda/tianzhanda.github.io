title: "Tian"
author: "tianzhanda"
description: "科技博客"
url: "https://tianzhanda.github.io"

minimal_mistakes_skin: "dark"

remote_theme: "mmistakes/minimal-mistakes@4.27.0"

exclude:
  - "private"
  - "Gemfile"
  - "Gemfile.lock"
  - "README.md"

include:
  - "_pages"

markdown: kramdown
paginate: 5

enable_copy_code_button: true

breadcrumbs: true

comments:
  provider: "utterances"
  utterances:
    repo: "tianzhanda/tianzhanda.github.io"
    issue_term: "pathname"
    label: "comment"
    theme: "github-dark"

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-include-cache

defaults:
  - scope:
      path: "_posts"
    values:
      layout: single
      author_profile: true
      toc: true
      read_time: true
      comments: true
      share: true
      related: true
